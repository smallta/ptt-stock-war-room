name: PTT Stock War Room Auto Crawl & Deploy

on:
  schedule:
    # Taiwan Time (UTC+8): Mon-Fri at 09:00, 11:45, 14:00, 18:30
    - cron: '0 1 * * 1-5'
    - cron: '45 3 * * 1-5'
    - cron: '0 6 * * 1-5'
    - cron: '30 10 * * 1-5'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  crawl-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: 📦 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🚀 Run PTT Stock Crawler & AI Chip Engine
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/dashboard/
        run: |
          python stock_crawler.py

      - name: 💾 Commit & Push Updated History and Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add history_data.json hot_stocks_sentiment.csv market_data.json detail_data.json dashboard/data.js tg_digest_report.txt
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update market data & 7-day history [skip ci]" && git push)

      - name: 🌐 Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
