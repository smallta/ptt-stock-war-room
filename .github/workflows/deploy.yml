name: PTT Stock War Room Auto Crawl & Deploy

on:
  schedule:
    # 台灣時間 (UTC+8)：週一至週五
    # 11/27 驗收：14:30 主抓每次被 dup_check skip（前一晚 21:47 延遲到今日凌晨已 commit，LAST_DATE=TODAY）
    # 砍除 14:30 主抓，只留 21:47 備援。實測延遲 ~5h 落隔日凌晨 02:xx，但資料完整（57 檔 vs 11/18 殘缺 9 檔）
    - cron: '47 13 * * 1-5'   # 21:47 Taipei (實測延遲 ~5h 落隔日凌晨 02:xx)
  workflow_dispatch: # 支援在 Actions 頁面手動點擊執行

permissions:
  contents: write

jobs:
  crawl-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 檢出程式碼
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🔍 檢查今日是否已跑過 (避免 3 段 cron 重複跑)
        id: dup_check
        run: |
          TODAY_TPE=$(TZ='Asia/Taipei' date +%Y-%m-%d)
          LAST_AUTO=$(git log -1 --format='%ai' --grep='Auto-update market data' || echo '')
          echo "今日 Taipei 日期: $TODAY_TPE"
          echo "上次 auto-update commit 時間: $LAST_AUTO"
          if [ -n "$LAST_AUTO" ]; then
            LAST_DATE_TPE=$(TZ='Asia/Taipei' date -d "$LAST_AUTO" +%Y-%m-%d 2>/dev/null || echo '')
            if [ "$LAST_DATE_TPE" = "$TODAY_TPE" ]; then
              echo "今日 $TODAY_TPE 已有 auto-update commit，跳過本次執行"
              echo "skip=true" >> $GITHUB_OUTPUT
              exit 0
            fi
          fi
          echo "今日尚未跑過，繼續執行"
          echo "skip=false" >> $GITHUB_OUTPUT

      - name: 📦 安裝相依套件
        if: steps.dup_check.outputs.skip != 'true'
        run: |
          pip install requests beautifulsoup4 pandas

      - name: 🚀 執行爬蟲與族群籌碼分析
        if: steps.dup_check.outputs.skip != 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_PAGES_URL: https://smallta.github.io/ptt-stock-war-room/
        run: |
          python3 stock_crawler.py

      - name: 💾 自動存檔並更新戰情室數據
        if: steps.dup_check.outputs.skip != 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update market data & 7-day history [skip ci]" && git push)
