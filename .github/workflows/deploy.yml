name: PTT Stock War Room Auto Crawl & Deploy

on:
  schedule:
    # 台灣時間 (UTC+8)：週一至週五 09:00、11:45、14:00、18:30 自動執行
    - cron: '0 1 * * 1-5'
    - cron: '45 3 * * 1-5'
    - cron: '0 6 * * 1-5'
    - cron: '30 10 * * 1-5'
  workflow_dispatch: # 支援在 Actions 頁面手動點擊執行

permissions:
  contents: write

jobs:
  crawl-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 檢出程式碼
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 📦 安裝相依套件
        run: |
          pip install requests beautifulsoup4 pandas

      - name: 🚀 執行爬蟲與族群籌碼分析
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_PAGES_URL: https://smallta.github.io/ptt-stock-war-room/
        run: |
          python3 stock_crawler.py

      - name: 💾 自動存檔並更新戰情室數據
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update market data & 7-day history [skip ci]" && git push)
