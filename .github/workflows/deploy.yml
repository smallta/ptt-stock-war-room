name: PTT Stock War Room Auto Crawl & Deploy

on:
  schedule:
    # 台灣時間 (UTC+8)：週一至週五
    # 11/16-19 驗證 UTC 13:47 晚間高峰 → 延遲 8-9h 落隔日清晨，且清晨跑 PTT/TG 內容殘缺（11/18 僅 9 檔、11/19 僅 17 檔）
    # 改為盤後 14:30 主抓（UTC 06:30 Actions 離峰窗、收盤 1h 鄉民正發酵），21:47 備援補充（dup_check 已做過會 skip）
    - cron: '30 6 * * 1-5'    # 14:30 Taipei (主抓 - 盤後離峰窗)
    - cron: '47 13 * * 1-5'   # 21:47 Taipei (備援 - 若主抓當日未成功則補跑)
  workflow_dispatch: # 支援在 Actions 頁面手動點擊執行

permissions:
  contents: write

jobs:
  crawl-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 檢出程式碼
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🔍 檢查今日是否已跑過 (避免 3 段 cron 重複跑)
        id: dup_check
        run: |
          TODAY_TPE=$(TZ='Asia/Taipei' date +%Y-%m-%d)
          LAST_AUTO=$(git log -1 --format='%ai' --grep='Auto-update market data' || echo '')
          echo "今日 Taipei 日期: $TODAY_TPE"
          echo "上次 auto-update commit 時間: $LAST_AUTO"
          if [ -n "$LAST_AUTO" ]; then
            LAST_DATE_TPE=$(TZ='Asia/Taipei' date -d "$LAST_AUTO" +%Y-%m-%d 2>/dev/null || echo '')
            if [ "$LAST_DATE_TPE" = "$TODAY_TPE" ]; then
              echo "今日 $TODAY_TPE 已有 auto-update commit，跳過本次執行"
              echo "skip=true" >> $GITHUB_OUTPUT
              exit 0
            fi
          fi
          echo "今日尚未跑過，繼續執行"
          echo "skip=false" >> $GITHUB_OUTPUT

      - name: 📦 安裝相依套件
        if: steps.dup_check.outputs.skip != 'true'
        run: |
          pip install requests beautifulsoup4 pandas

      - name: 🚀 執行爬蟲與族群籌碼分析
        if: steps.dup_check.outputs.skip != 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_PAGES_URL: https://smallta.github.io/ptt-stock-war-room/
        run: |
          python3 stock_crawler.py

      - name: 💾 自動存檔並更新戰情室數據
        if: steps.dup_check.outputs.skip != 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update market data & 7-day history [skip ci]" && git push)
