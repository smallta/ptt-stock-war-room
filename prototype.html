
<!DOCTYPE html><html><head><meta charset="utf-8">
<title>Investment Signal Dashboard Prototype</title>
<style>
body{font-family:Arial;background:#111;color:#eee;margin:40px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.card{background:#1d1d1d;border-radius:12px;padding:16px}
table{width:100%;border-collapse:collapse}
td,th{border-bottom:1px solid #333;padding:8px}
</style></head><body>
<h1>Investment Signal Dashboard</h1>
<div class="grid">
<div class="card"><h2>🔥 今日 AI 發現</h2><p>新增股票:18<br>值得研究:6<br>爆發中:3</p></div>
<div class="card"><h2>Hidden Score Top5</h2><ol><li>XYZ 92</li><li>ABC 88</li></ol></div>
<div class="card"><h2>Trend Score</h2><ol><li>AAA 95</li><li>BBB 90</li></ol></div>
</div>
<h2>Early Discovery</h2>
<table><tr><th>股票</th><th>提及</th><th>Hidden</th><th>Trend</th></tr>
<tr><td>XYZ</td><td>12</td><td>92</td><td>89</td></tr>
<tr><td>ABC</td><td>9</td><td>88</td><td>84</td></tr>
</table>
</body></html>
